# Gradle and Kotlin daemon memory bounds for stable CI and local builds
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:+ParallelRefProcEnabled
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseG1GC
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# High-performance parallel multi-module execution and build caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache=false

# Incremental compilation across modules
kotlin.incremental=true
ksp.incremental=true
ksp.incremental.intermodule=true
