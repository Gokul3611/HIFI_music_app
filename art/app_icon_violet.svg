<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad_violet" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161022"/>
      <stop offset="100%" stop-color="#0B0713"/>
    </linearGradient>

    <!-- Glyph Metallic Gradient -->
    <linearGradient id="glyphGrad_violet" x1="160" y1="120" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <!-- Ambient Backlight Radial Glow -->
    <radialGradient id="aura_violet" cx="50%" cy="56%" r="46%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0B0713" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Drop Shadow on Glyph -->
    <filter id="shadow_violet" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#A855F7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Premium Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad_violet)"/>

  <!-- Subtle Beveled Rim Light -->
  <rect x="2" y="2" width="508" height="508" rx="114" stroke="rgba(192, 132, 252, 0.15)" stroke-width="2.5"/>

  <!-- Acoustic Vinyl Concentric Micro-Grooves -->
  <circle cx="256" cy="256" r="218" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1.2"/>
  <circle cx="256" cy="256" r="184" stroke="#FFFFFF" stroke-opacity="0.028" stroke-width="1.2"/>
  <circle cx="256" cy="256" r="150" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1.2"/>
  <circle cx="256" cy="256" r="116" stroke="#FFFFFF" stroke-opacity="0.015" stroke-width="1.2"/>

  <!-- Ambient Light Aura -->
  <circle cx="256" cy="270" r="180" fill="url(#aura_violet)"/>

  <!-- The Minimalist Double Beamed Musical Note Glyph -->
  <!-- Transformed from 24x24 reference: scaled 15.5x, centered with optical balance -->
  <g transform="translate(256, 256) scale(15.5) translate(-12, -12)" filter="url(#shadow_violet)">
    <!-- Solid weighted noteheads -->
    <ellipse cx="6" cy="19" rx="3" ry="2" fill="url(#glyphGrad_violet)"/>
    <ellipse cx="18" cy="17" rx="3" ry="2" fill="url(#glyphGrad_violet)"/>
    <!-- Precision stems and dual horizontal beams -->
    <path d="M9 19C9 20.1046 7.65685 21 6 21C4.34315 21 3 20.1046 3 19C3 17.8954 4.34315 17 6 17C7.65685 17 9 17.8954 9 19ZM9 19V5L21 3V17M21 17C21 18.1046 19.6569 19 18 19C16.3431 19 15 18.1046 15 17C15 15.8954 16.3431 15 18 15C19.6569 15 21 15.8954 21 17ZM9 9L21 7"
          stroke="url(#glyphGrad_violet)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>