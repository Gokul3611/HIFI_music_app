name: Build Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/spotify-sync-onboarding-prompt
      - feature/custom-app-icons
  pull_request:
    branches:
      - master
      - feature/custom-app-icons

permissions:
  contents: write

jobs:
  build:
    name: Build Music APK
    runs-on: ubuntu-latest
    timeout-minutes: 35 # Allows plenty of time for cold multi-module + C++ NDK build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Fix gradlew permissions
        run: chmod +x gradlew

      - name: Ensure Android NDK & CMake
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/27.0.12077973" ]; then
            echo "Installing NDK 27.0.12077973 and CMake..."
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
          else
            echo "Android NDK 27.0.12077973 is already available at $ANDROID_HOME/ndk/27.0.12077973"
          fi

      - name: Build Release APK
        env:
          LOSSLESS_CONFIG_URL: "https://stash-tipjar.rawnaldclark.workers.dev/lossless.json"
          LOSSLESS_CONFIG_PUBKEY: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAELiPYu7/k+TmVCojPEECT2w8tTnoy597StnnmS3vSiPxJ9AtluqhnIinmdknRi+h2ElUzkXYHoJjfzpoLGF46Cg"
        run: |
          set -o pipefail
          ./gradlew assembleRelease --parallel --build-cache --stacktrace 2>&1 | tee android-build.log

      - name: Surface build failure details
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY' > android-test-failures.log
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path(".").glob("**/build/test-results/testDebugUnitTest/TEST-*.xml"))
          if not reports:
              print("No JUnit XML reports were produced.")
          for report in reports:
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  for result in case:
                      if result.tag not in {"failure", "error"}:
                          continue
                      print(f"{case.get('classname')}#{case.get('name')}: {result.get('type', result.tag)}")
                      if result.get("message"):
                          print(result.get("message"))
                      if result.text:
                          print("\n".join(result.text.splitlines()[:18]))
                      print()
          PY
          for log_file in android-build.log android-test-failures.log; do
            if [ -f "$log_file" ]; then
              if [ "$log_file" = "android-build.log" ]; then
                details="$(grep -E '(^e: |^FAILURE:|What went wrong:|Execution failed for task|Unresolved reference|Type mismatch|Cannot infer|Expecting |Compilation error|There were failing tests|tests? failed|FAILED)' "$log_file" | tail -n 45 || true)"
                if [ -z "$details" ]; then
                  details="$(tail -n 45 "$log_file")"
                fi
              elif [ "$log_file" = "android-test-failures.log" ]; then
                details="$(head -n 65 "$log_file")"
              else
                details="$(tail -n 45 "$log_file")"
              fi
              details="${details//'%'/'%25'}"
              details="${details//$'\r'/'%0D'}"
              details="${details//$'\n'/'%0A'}"
              echo "::error title=${log_file} tail::${details}"
            fi
          done

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-logs
          path: |
            android-build.log
            android-test-failures.log
            core/media/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare APK for Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/Music.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music-HiFi-App
          path: |
            dist/Music.apk
          retention-days: 14

      - name: Create or Update Test GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/feature/spotify-sync-onboarding-prompt' || github.ref == 'refs/heads/feature/custom-app-icons'
        with:
          tag_name: test-build
          name: "Music Hi-Fi Test Build (Spotify Sync & Custom Icons)"
          prerelease: true
          make_latest: false
          body: |
            🧪 **Test Build for Gokul**
            - **Spotify Onboarding Prompt**: Gentle first-run prompt after app exploration (~25s) with single-click redirect to Spotify sign-in.
            - **App Icon Visual Previews**: Rich vector-accurate squircle preview thumbnails and 8-theme picker sheet (Settings > Appearance).
            - **Queue Drag-to-Top**: Smooth auto-scrolling all the way to index 0 across scroll boundaries.
            - **Direct Equalizer Access**: Equalizer shortcut added to Now Playing "Track Options" (3-dots menu) and queue track options.
            - **Dynamic Widget Icon & Previews**: Widget search in launcher now dynamically inherits the active app icon theme and refreshes in real time; updated widget placeholders to titanium silver branding.
            - **Lockscreen Music Info**: Lockscreen song title viewing visibility fixes.
            - **Decluttered Curated Home & About**: Curated home screen, Tidal unlimited, and technical Linux-style changelog dialog in Settings > About & Help.
          files: dist/Music.apk
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: v0.9.138
          name: "Music Hi-Fi v0.9.138"
          body: |
            <!-- stash-app
            Official update from Gokul (Developer). Safe to install!
            - Production Update Fix | Restored production package identity to com.stash.app.debug so all v0.9.135 and v0.9.136 users can update seamlessly in-place.
            - Spotify Sync Onboarding | Gentle first-run prompt to sync Spotify playlists and library with 1-tap sign-in redirect.
            - Custom Dynamic App Icons | 8 audiophile-themed dynamic launcher icons with in-app preview sheet (Settings > Appearance).
            - Real-Time Widget Theming | Dynamic launcher widget search icon inheritance and modernized titanium silver widget styling.
            - Lockscreen Song Titles | Enforced public notification channels ensuring track metadata and art show on all Android lockscreens.
            - Queue Drag-to-Top | Fixed viewport boundaries allowing tracks to be dragged smoothly to index 0.
            - Direct Equalizer Access | Equalizer shortcut directly reachable from Now Playing track options and queue menus.
            -->
            ### 🎵 Music Hi-Fi v0.9.138 - Official Release

            > **📢 Notice from Gokul:** This release fixes in-app updates for all existing users on v0.9.135 and v0.9.136. Your app will update cleanly in place with zero data loss!

            #### 🌟 Highlights & What's New:
            - **📦 In-Place Update Fix**: Matches your installed production app identity (`com.stash.app.debug`), allowing in-app updates to download and install instantly.
            - **🎨 8 Custom Dynamic App Icons & Visual Picker**: Choose from Obsidian Titanium, Cyber Emerald, Electric Violet, Sunset Amber, Ocean Sapphire, Crimson Ruby, Midnight Gold, or Minimal Mono with live vector-accurate preview thumbnails (**Settings > Appearance > App icon**).
            - **📱 Real-Time Widget Icon & Previews**: Launcher widget search and tray now dynamically inherit the active app icon theme and refresh instantly; widget previews modernized to sleek titanium silver.
            - **🎧 Spotify Sync Onboarding Prompt**: First-run gentle prompt appearing after initial app exploration (~25 seconds) offering a one-click redirect to Spotify library sync.
            - **🔒 Lockscreen Song Title & Cover Viewing**: Enforced `VISIBILITY_PUBLIC` notification channel and fallback metadata builders ensuring track title and artist display reliably on lockscreens across all Android versions and OEM skins.
            - **🎚️ Direct Equalizer Access**: Tap the 3-dots "Track Options" menu directly on the Now Playing screen or in the playback queue to jump straight into the 10-band Equalizer.
            - **📋 Queue Drag-to-Top**: Fixed auto-scrolling viewport boundaries in the playback queue sheet so reordered songs can easily be moved all the way to index 0.
            - **✨ Curated Home Screen & Supporter Perks**: Decluttered home tab, removed upstream telemetry workers and unauthenticated network pings, and unlocked unlimited Tidal streaming.
            - **🐧 Technical Fork Changelog**: New Linux-style breakdown of all architectural, audio pipeline, and ESP32 streaming modifications (**Settings > About & Help > Changes from Stash fork**).

            #### 📦 Download:
            Download `Music.apk` below or tap "Update now" inside the app.
          files: dist/Music.apk
