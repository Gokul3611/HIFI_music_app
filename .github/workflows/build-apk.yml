name: Build Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  build:
    name: Build Music APK
    runs-on: ubuntu-latest
    timeout-minutes: 35 # Allows plenty of time for cold multi-module + C++ NDK build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure 8GB Swap Space (Prevent OOM Killer)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew permissions
        run: chmod +x gradlew

      - name: Accept SDK Licenses & Install NDK + CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Arduino core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Compile ESP32 firmware
        run: |
          set -o pipefail
          {
            mkdir -p dist/firmware
            arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir dist/firmware firmware_wifi_softap
            ESP32_CORE="$(arduino-cli config get directories.data)/packages/esp32/hardware/esp32/2.0.17"
            APP_BIN="$(find dist/firmware -maxdepth 1 -type f -name '*.bin' ! -name '*.bootloader.bin' ! -name '*.partitions.bin' -print -quit)"
            BOOTLOADER_BIN="$(find dist/firmware -maxdepth 1 -type f -name '*.bootloader.bin' -print -quit)"
            PARTITIONS_BIN="$(find dist/firmware -maxdepth 1 -type f -name '*.partitions.bin' -print -quit)"
            ESPTOOL="$ESP32_CORE/tools/esptool/esptool.py"
            if [[ -z "$APP_BIN" || -z "$BOOTLOADER_BIN" || -z "$PARTITIONS_BIN" || ! -f "$ESPTOOL" ]]; then
              echo "Arduino ESP32 compiler did not produce the expected flash images." >&2
              exit 1
            fi
            python3 "$ESPTOOL" --chip esp32 merge_bin \
              -o dist/firmware/ESP32-WiFi-SoftAP-full-flash.bin \
              --flash_mode keep --flash_freq keep --flash_size keep \
              0x1000 "$BOOTLOADER_BIN" \
              0x8000 "$PARTITIONS_BIN" \
              0xe000 "$ESP32_CORE/tools/partitions/boot_app0.bin" \
              0x10000 "$APP_BIN"
            ls -lh dist/firmware/*.bin
          } 2>&1 | tee firmware-build.log

      - name: Run unit tests and build Debug APK
        env:
          LOSSLESS_CONFIG_URL: "https://stash-tipjar.rawnaldclark.workers.dev/lossless.json"
          LOSSLESS_CONFIG_PUBKEY: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAELiPYu7/k+TmVCojPEECT2w8tTnoy597StnnmS3vSiPxJ9AtluqhnIinmdknRi+h2ElUzkXYHoJjfzpoLGF46Cg"
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --no-parallel --max-workers=2 --stacktrace 2>&1 | tee android-build.log

      - name: Surface build failure details
        if: failure()
        shell: bash
        run: |
          for log_file in firmware-build.log android-build.log; do
            if [ -f "$log_file" ]; then
              details="$(tail -n 45 "$log_file")"
              details="${details//'%'/'%25'}"
              details="${details//$'\r'/'%0D'}"
              details="${details//$'\n'/'%0A'}"
              echo "::error title=${log_file} tail::${details}"
            fi
          done

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-logs
          path: |
            firmware-build.log
            android-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare APK for Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/Music.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music-HiFi-App
          path: |
            dist/Music.apk
            dist/firmware/*.bin
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v0.9.125
          name: "Music Hi-Fi v0.9.125"
          body: |
            ### 🎵 Music Hi-Fi v0.9.125 - Spotify-Like Autoplay & Bit-Perfect FLAC Streaming

            #### 🌟 Highlights & New Features:
            - **Spotify-Like Continuous Autoplay**: When playing any single song or reaching the end of an album/playlist, similar songs are automatically queued and played seamlessly without silence.
            - **Algorithmic Music Discovery (Zero API Keys Needed)**: Native YouTube Music InnerTube "Up Next" / "Related" engine fallback ensures infinite music discovery without needing Last.fm API credentials.
            - **Verified Online FLAC Streaming**: Cryptographically signed Tidal lossless relay (ECDSA P-256) enables bit-perfect 16/44.1, 24/48, and 24/96 online streaming.
            - **ESP32 Wi-Fi DAC Streaming**: Stream uncompressed 24-bit / 96 kHz PCM directly to an ESP32 + PCM5102A 32-bit DAC over Wi-Fi Hotspot.
            - **Custom In-App Updates**: Built-in updater is now anchored to `Gokul3611/HIFI_music_app` releases.

            #### 📦 Download:
            Download `Music.apk` below and install on Android 8.0+.
          files: dist/Music.apk
