name: Build Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/spotify-sync-onboarding-prompt
      - feature/custom-app-icons
      - feature/widget-ultra-low-power-playback
      - feature/library-redesign-smart-shuffle
  pull_request:
    branches:
      - master
      - feature/custom-app-icons
      - feature/widget-ultra-low-power-playback

permissions:
  contents: write

jobs:
  build:
    name: Build Music APK
    runs-on: ubuntu-latest
    timeout-minutes: 35 # Allows plenty of time for cold multi-module + C++ NDK build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Fix gradlew permissions
        run: chmod +x gradlew

      - name: Ensure Android NDK & CMake
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/27.0.12077973" ]; then
            echo "Installing NDK 27.0.12077973 and CMake..."
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
          else
            echo "Android NDK 27.0.12077973 is already available at $ANDROID_HOME/ndk/27.0.12077973"
          fi

      - name: Build Release APK
        env:
          LOSSLESS_CONFIG_URL: "https://stash-tipjar.rawnaldclark.workers.dev/lossless.json"
          LOSSLESS_CONFIG_PUBKEY: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAELiPYu7/k+TmVCojPEECT2w8tTnoy597StnnmS3vSiPxJ9AtluqhnIinmdknRi+h2ElUzkXYHoJjfzpoLGF46Cg"
        run: |
          set -o pipefail
          ./gradlew assembleRelease --parallel --build-cache --stacktrace 2>&1 | tee android-build.log

      - name: Surface build failure details
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY' > android-test-failures.log
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path(".").glob("**/build/test-results/testDebugUnitTest/TEST-*.xml"))
          if not reports:
              print("No JUnit XML reports were produced.")
          for report in reports:
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  for result in case:
                      if result.tag not in {"failure", "error"}:
                          continue
                      print(f"{case.get('classname')}#{case.get('name')}: {result.get('type', result.tag)}")
                      if result.get("message"):
                          print(result.get("message"))
                      if result.text:
                          print("\n".join(result.text.splitlines()[:18]))
                      print()
          PY
          for log_file in android-build.log android-test-failures.log; do
            if [ -f "$log_file" ]; then
              if [ "$log_file" = "android-build.log" ]; then
                details="$(grep -E '(^e: |^FAILURE:|What went wrong:|Execution failed for task|Unresolved reference|Type mismatch|Cannot infer|Expecting |Compilation error|There were failing tests|tests? failed|FAILED)' "$log_file" | tail -n 45 || true)"
                if [ -z "$details" ]; then
                  details="$(tail -n 45 "$log_file")"
                fi
              elif [ "$log_file" = "android-test-failures.log" ]; then
                details="$(head -n 65 "$log_file")"
              else
                details="$(tail -n 45 "$log_file")"
              fi
              details="${details//'%'/'%25'}"
              details="${details//$'\r'/'%0D'}"
              details="${details//$'\n'/'%0A'}"
              echo "::error title=${log_file} tail::${details}"
            fi
          done

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-logs
          path: |
            android-build.log
            android-test-failures.log
            core/media/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare APK for Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/Music.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music-HiFi-App
          path: |
            dist/Music.apk
          retention-days: 14

      - name: Create or Update Test GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/feature/spotify-sync-onboarding-prompt' || github.ref == 'refs/heads/feature/custom-app-icons' || github.ref == 'refs/heads/feature/widget-ultra-low-power-playback' || github.ref == 'refs/heads/feature/library-redesign-smart-shuffle'
        with:
          tag_name: test-build
          name: "Music Hi-Fi Test Build (Library Redesign & AI Smart Shuffle)"
          prerelease: true
          make_latest: false
          body: |
            🧪 **Test Build: Audio Vibe Continuity & AI Smart Shuffle**
            - **🎧 Playback Stability**: Restored ultra-low-power headless launcher widget, eliminating cover art load crashes on song start.
            - **✨ AI Smart Shuffle Button**: Integrated clean AI Shuffle icon button directly beside classic Shuffle across Library, Liked, and Device tabs.
            - **🎶 Genre & Vibe Continuity**: Enhanced recommendation and autoplay engine with strict stylistic clustering — romantic/acoustic tracks maintain seamless romantic flow, never jumping to rock or folk.
            - **📱 Dual ARM ABI Support**: Full dual `arm64-v8a` and `armeabi-v7a` architecture support comfortably below 80MB.
          files: dist/Music.apk
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: v0.9.139
          name: "Music Hi-Fi v0.9.139"
          body: |
            <!-- stash-app
            Official update from Gokul (Developer). Safe to install!
            - 50% APK Size Cut | Dropped legacy 32-bit armeabi-v7a native binaries; APK cut from 74 MB to 44 MB for modern arm64-v8a devices.
            - Ultra-Low-Power Widget | Headless background launcher widget playback with full Previous/Play/Pause/Next controls and zero UI launch overhead.
            - Instant Navigation | Removed transition latency for instantaneous library browsing, pre-warmed player sheets, and low-latency 50ms buffer start.
            - Bit-Perfect Continuity | Complete preservation of 24-bit bit-perfect DSP and ESP32 SoftAP Wi-Fi DAC streaming.
            -->
            ### 🎵 Music Hi-Fi v0.9.139 - Official Release

            > **📢 Notice from Gokul:** This release drastically reduces app size by nearly 50% (~44 MB, down from ~74 MB) and adds ultra-low-power launcher widget playback controls and instantaneous UI navigation!

            #### 🌟 Highlights & What's New:
            - **📦 50% Smaller Download**: Removed duplicate legacy 32-bit native libraries (FFmpeg/Python) while keeping complete 64-bit ARM (`arm64-v8a`) compatibility for all modern Android 10+ devices.
            - **⚡ Instantaneous UI Transitions**: Stripped navigation delays for click-to-open responsiveness, pre-warmed Now Playing bottom sheets, and optimized 50ms playback startup buffer.
            - **🔋 Ultra-Low-Power Launcher Widget**: Direct headless service transport with Previous [⏮], Play/Pause [⏯], and Next [⏭] controls that run without waking foreground activities.
            - **🎛️ Bit-Perfect Audio & ESP32 DAC Engine**: Native bit-perfect DSP pipeline and wireless ESP32 SoftAP DAC streamer remain 100% intact and uncompromised.
            - **🔄 Seamless In-App Updates**: Built with package identity `com.stash.app.debug` to update smoothly over your existing install without losing any library data.

            #### 📦 Download:
            Download `Music.apk` below or tap "Update now" inside the app.
          files: dist/Music.apk
