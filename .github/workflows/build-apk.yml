name: Build Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  build:
    name: Build Music APK
    runs-on: ubuntu-latest
    timeout-minutes: 35 # Allows plenty of time for cold multi-module + C++ NDK build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Configure Swap Space (Prevent OOM Killer)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew permissions
        run: chmod +x gradlew

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/27.0.12077973
          key: ${{ runner.os }}-ndk-27.0.12077973

      - name: Accept SDK Licenses & Install NDK + CMake
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Run unit tests and build Release APK
        env:
          LOSSLESS_CONFIG_URL: "https://stash-tipjar.rawnaldclark.workers.dev/lossless.json"
          LOSSLESS_CONFIG_PUBKEY: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAELiPYu7/k+TmVCojPEECT2w8tTnoy597StnnmS3vSiPxJ9AtluqhnIinmdknRi+h2ElUzkXYHoJjfzpoLGF46Cg"
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleRelease --no-daemon --no-parallel --max-workers=2 --stacktrace 2>&1 | tee android-build.log

      - name: Surface build failure details
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY' > android-test-failures.log
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path(".").glob("**/build/test-results/testDebugUnitTest/TEST-*.xml"))
          if not reports:
              print("No JUnit XML reports were produced.")
          for report in reports:
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  for result in case:
                      if result.tag not in {"failure", "error"}:
                          continue
                      print(f"{case.get('classname')}#{case.get('name')}: {result.get('type', result.tag)}")
                      if result.get("message"):
                          print(result.get("message"))
                      if result.text:
                          print("\n".join(result.text.splitlines()[:18]))
                      print()
          PY
          for log_file in android-build.log android-test-failures.log; do
            if [ -f "$log_file" ]; then
              if [ "$log_file" = "android-build.log" ]; then
                details="$(grep -E '(^e: |^FAILURE:|What went wrong:|Execution failed for task|Unresolved reference|Type mismatch|Cannot infer|Expecting |Compilation error|There were failing tests|tests? failed|FAILED)' "$log_file" | tail -n 45 || true)"
                if [ -z "$details" ]; then
                  details="$(tail -n 45 "$log_file")"
                fi
              elif [ "$log_file" = "android-test-failures.log" ]; then
                details="$(head -n 65 "$log_file")"
              else
                details="$(tail -n 45 "$log_file")"
              fi
              details="${details//'%'/'%25'}"
              details="${details//$'\r'/'%0D'}"
              details="${details//$'\n'/'%0A'}"
              echo "::error title=${log_file} tail::${details}"
            fi
          done

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-logs
          path: |
            android-build.log
            android-test-failures.log
            core/media/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare APK for Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/Music.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music-HiFi-App
          path: |
            dist/Music.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v0.9.133
          name: "Music Hi-Fi v0.9.133"
          body: |
            <!-- stash-app
            Official update from Gokul (Developer). Safe to install!
            - Verified Official Update | Upstream Stash updates are blocked; this is our official verified update, safe to install.
            - Lockscreen Song Display | Enforced public visibility and displayTitle for full title and artist visibility on lockscreen notifications.
            - ESP32 Dual-Mode Wi-Fi DAC | Dynamic pop-free switching between 32-bit PCM5102A and 8-bit built-in DAC with TPDF dither, starvation-free FreeRTOS handshake, and dedicated GPIOs.
            - Clean Architecture | Flattened workspace repository and updated user-facing branding to Music.
            -->
            ### 🎵 Music Hi-Fi v0.9.133 - Official Verified Update

            > **📢 Notice from Gokul:** This is an official, verified update from our repository. Upstream Stash updates have been blocked to prevent overwriting your installation and data. You can safely install this update directly!

            #### 🌟 Highlights & What's New:
            - **Lockscreen Notification Song Title Display**: Enforced `VISIBILITY_PUBLIC` and explicit `.setDisplayTitle(title)` so song titles and artists are fully visible on Android secure lockscreen notifications.
            - **ESP32 Dual-Mode DAC Switching**: Dynamic pop-free switching between external 32-bit PCM5102A and internal built-in DAC with 1-LSB symmetric TPDF dither and mid-scale 1.65V DC silence.
            - **Starvation-Free Real-Time Audio Engine**: Pause/resume FreeRTOS semaphore handshake, sample-rate adaptive prebuffer watermarks (~40 ms), dynamic write timeouts, and 8-byte frame stream alignment.
            - **Dedicated Hardware Pinout**: Dedicated GPIO 27 (BCK), GPIO 14 (WS), GPIO 22 (DIN) keeps high-frequency digital clock signals isolated from analog amplifier pins on GPIO 25/26.
            - **Streamlined Repository & Branding**: Cleaned up unneeded web/worker files, flattened directory structure, and updated user-facing branding to Music.

            #### 📦 Download:
            Download `Music.apk` below or tap "Update now" inside the app.
          files: dist/Music.apk
