name: Build Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/spotify-sync-onboarding-prompt
      - feature/custom-app-icons
      - feature/widget-ultra-low-power-playback
      - master
  pull_request:
    branches:
      - master
      - feature/custom-app-icons
      - feature/widget-ultra-low-power-playback
      - feature/esp32-playback-fixes

permissions:
  contents: write

jobs:
  build:
    name: Build Music APK
    runs-on: ubuntu-latest
    timeout-minutes: 35 # Allows plenty of time for cold multi-module + C++ NDK build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Fix gradlew permissions
        run: chmod +x gradlew

      - name: Ensure Android NDK & CMake
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/27.0.12077973" ]; then
            echo "Installing NDK 27.0.12077973 and CMake..."
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
          else
            echo "Android NDK 27.0.12077973 is already available at $ANDROID_HOME/ndk/27.0.12077973"
          fi

      - name: Build Release APK
        env:
          LOSSLESS_CONFIG_URL: "https://stash-tipjar.rawnaldclark.workers.dev/lossless.json"
          LOSSLESS_CONFIG_PUBKEY: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAELiPYu7/k+TmVCojPEECT2w8tTnoy597StnnmS3vSiPxJ9AtluqhnIinmdknRi+h2ElUzkXYHoJjfzpoLGF46Cg"
        run: |
          set -o pipefail
          ./gradlew assembleRelease --parallel --build-cache --stacktrace 2>&1 | tee android-build.log

      - name: Surface build failure details
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY' > android-test-failures.log
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path(".").glob("**/build/test-results/testDebugUnitTest/TEST-*.xml"))
          if not reports:
              print("No JUnit XML reports were produced.")
          for report in reports:
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  for result in case:
                      if result.tag not in {"failure", "error"}:
                          continue
                      print(f"{case.get('classname')}#{case.get('name')}: {result.get('type', result.tag)}")
                      if result.get("message"):
                          print(result.get("message"))
                      if result.text:
                          print("\n".join(result.text.splitlines()[:18]))
                      print()
          PY
          for log_file in android-build.log android-test-failures.log; do
            if [ -f "$log_file" ]; then
              if [ "$log_file" = "android-build.log" ]; then
                details="$(grep -E '(^e: |^FAILURE:|What went wrong:|Execution failed for task|Unresolved reference|Type mismatch|Cannot infer|Expecting |Compilation error|There were failing tests|tests? failed|FAILED)' "$log_file" | tail -n 45 || true)"
                if [ -z "$details" ]; then
                  details="$(tail -n 45 "$log_file")"
                fi
              elif [ "$log_file" = "android-test-failures.log" ]; then
                details="$(head -n 65 "$log_file")"
              else
                details="$(tail -n 45 "$log_file")"
              fi
              details="${details//'%'/'%25'}"
              details="${details//$'\r'/'%0D'}"
              details="${details//$'\n'/'%0A'}"
              echo "::error title=${log_file} tail::${details}"
            fi
          done

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-logs
          path: |
            android-build.log
            android-test-failures.log
            core/media/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare APK for Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/Music.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music-HiFi-App
          path: |
            dist/Music.apk
          retention-days: 14

      - name: Create or Update Test GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/feature/library-redesign-smart-shuffle' || github.ref == 'refs/heads/feature/esp32-playback-fixes'
        with:
          tag_name: test-build
          name: "Music Hi-Fi Test Build"
          prerelease: true
          make_latest: false
          body: |
            🧪 **Test Build: Audio Vibe Continuity, AI Smart Shuffle & ESP32 Fixes**
            - **🎧 Playback Stability**: Restored ultra-low-power headless launcher widget, eliminating cover art load crashes on song start.
            - **✨ AI Smart Shuffle Button**: Integrated clean AI Shuffle icon button directly beside classic Shuffle across Library, Liked, and Device tabs.
            - **🎶 Genre & Vibe Continuity**: Enhanced recommendation and autoplay engine with strict stylistic clustering — romantic/acoustic tracks maintain seamless romantic flow, never jumping to rock or folk.
            - **📱 Dual ARM ABI Support**: Full dual `arm64-v8a` and `armeabi-v7a` architecture support comfortably below 80MB.
            - **📡 ESP32 Hi-Fi Streaming**: Paced audio stream, pop-free dynamic bias ramp, and low RF power profile.
          files: dist/Music.apk
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: v0.9.140
          name: "Music Hi-Fi v0.9.140"
          body: |
            <!-- stash-app
            Official update from Gokul (Developer). Safe to install!
            - AI Smart Shuffle & Vibe Continuity | New AI Shuffle button beside classic Shuffle with strict genre/mood clustering and O(N) non-blocking engine.
            - ESP32 Hi-Fi Audio Isolation & Firmware | Isolated PCM stream from system notifications, pop-free 1.65V bias ramp, 160MHz cooling optimization, and instant UDP FLUSH on seek.
            - Glance Widget Redesign | Responsive Jetpack Glance layout with low-memory RGB_565 squircle art and crash-proof zero-bitmap fallback.
            - Dual ARM ABI Support | Full 64-bit arm64-v8a and 32-bit armeabi-v7a support under 80 MB (~70.5 MB).
            -->
            ### 🎵 Music Hi-Fi v0.9.140 - Official Release

            > **📢 Notice from Gokul:** This major release introduces **AI Smart Shuffle with Vibe Continuity**, a **redesigned crash-proof home widget**, **isolated ESP32 Wi-Fi DAC streaming with pop-free firmware**, and **full 32-bit/64-bit ARM support**!

            #### 🌟 Highlights & What's New:
            - **✨ AI Smart Shuffle & Vibe Continuity**: Dedicated AI Shuffle button beside classic Shuffle across Library, Liked Songs, and Device tabs. Clusters tracks by musical mood so romantic/acoustic sessions never jump abruptly to rock or metal.
            - **📡 ESP32 Firmware & Audio Isolation**: Phone notifications, alarms, and videos no longer interrupt ESP32 wireless playback. Includes pop-free 0V→1.65V bias ramping, 160MHz thermal optimization, hardware-synced perceptual volume, and instant UDP `FLUSH` on seek.
            - **📱 Jetpack Glance Widget Redesign**: Canonical responsive widget layout with 160px `RGB_565` squircle art and zero-bitmap error fallback.
            - **📦 Dual ARM ABI Support**: Ships both `arm64-v8a` and `armeabi-v7a` (~70.5 MB) for compatibility across all Android devices.
            - **🔄 Seamless In-App Updates**: Built with package identity `com.stash.app.debug` to update smoothly over your existing install without losing any library data.

            #### 📦 Download:
            Download `Music.apk` below or tap "Update now" inside the app.
          files: dist/Music.apk
