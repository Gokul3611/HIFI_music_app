name: Build Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/spotify-sync-onboarding-prompt
      - feature/custom-app-icons
  pull_request:
    branches:
      - master
      - feature/custom-app-icons

permissions:
  contents: write

jobs:
  build:
    name: Build Music APK
    runs-on: ubuntu-latest
    timeout-minutes: 35 # Allows plenty of time for cold multi-module + C++ NDK build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Fix gradlew permissions
        run: chmod +x gradlew

      - name: Ensure Android NDK & CMake
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/27.0.12077973" ]; then
            echo "Installing NDK 27.0.12077973 and CMake..."
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
          else
            echo "Android NDK 27.0.12077973 is already available at $ANDROID_HOME/ndk/27.0.12077973"
          fi

      - name: Build Release APK
        env:
          LOSSLESS_CONFIG_URL: "https://stash-tipjar.rawnaldclark.workers.dev/lossless.json"
          LOSSLESS_CONFIG_PUBKEY: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAELiPYu7/k+TmVCojPEECT2w8tTnoy597StnnmS3vSiPxJ9AtluqhnIinmdknRi+h2ElUzkXYHoJjfzpoLGF46Cg"
        run: |
          set -o pipefail
          ./gradlew assembleRelease --parallel --build-cache --stacktrace 2>&1 | tee android-build.log

      - name: Surface build failure details
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY' > android-test-failures.log
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path(".").glob("**/build/test-results/testDebugUnitTest/TEST-*.xml"))
          if not reports:
              print("No JUnit XML reports were produced.")
          for report in reports:
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  for result in case:
                      if result.tag not in {"failure", "error"}:
                          continue
                      print(f"{case.get('classname')}#{case.get('name')}: {result.get('type', result.tag)}")
                      if result.get("message"):
                          print(result.get("message"))
                      if result.text:
                          print("\n".join(result.text.splitlines()[:18]))
                      print()
          PY
          for log_file in android-build.log android-test-failures.log; do
            if [ -f "$log_file" ]; then
              if [ "$log_file" = "android-build.log" ]; then
                details="$(grep -E '(^e: |^FAILURE:|What went wrong:|Execution failed for task|Unresolved reference|Type mismatch|Cannot infer|Expecting |Compilation error|There were failing tests|tests? failed|FAILED)' "$log_file" | tail -n 45 || true)"
                if [ -z "$details" ]; then
                  details="$(tail -n 45 "$log_file")"
                fi
              elif [ "$log_file" = "android-test-failures.log" ]; then
                details="$(head -n 65 "$log_file")"
              else
                details="$(tail -n 45 "$log_file")"
              fi
              details="${details//'%'/'%25'}"
              details="${details//$'\r'/'%0D'}"
              details="${details//$'\n'/'%0A'}"
              echo "::error title=${log_file} tail::${details}"
            fi
          done

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-logs
          path: |
            android-build.log
            android-test-failures.log
            core/media/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare APK for Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/Music.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music-HiFi-App
          path: |
            dist/Music.apk
          retention-days: 14

      - name: Create or Update Test GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/feature/spotify-sync-onboarding-prompt' || github.ref == 'refs/heads/feature/custom-app-icons'
        with:
          tag_name: test-build
          name: "Music Hi-Fi Test Build (Spotify Sync & Custom Icons)"
          prerelease: true
          make_latest: false
          body: |
            🧪 **Test Build for Gokul**
            - Includes Spotify Onboarding Prompt after exploration (~25s) with one-click sign-in redirect
            - Includes Custom App Icon Picker with live visual preview thumbnails (Settings > Appearance)
            - Fixed Queue Drag-to-Top auto-scrolling across viewports to index 0
            - Equalizer directly accessible from Now Playing "Track Options" sheet
          files: dist/Music.apk
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: v0.9.135
          name: "Music Hi-Fi v0.9.135"
          body: |
            <!-- stash-app
            Official update from Gokul (Developer). Safe to install!
            - 68 MB Ultra-Compact Build | Shrunk APK from 163 MB to 67.9 MB via R8 minification and native ABI stripping.
            - Fast Startup & Battery Savings | Staged app cold start, 16-connection warm keep-alive pool, and 50 MB response cache.
            - Pre-Update Snapshot & Rollback Safety | Automated stash.db backup before updates and emergency rollback recovery support.
            - ESP32 Dual-Mode Wi-Fi DAC | Dynamic pop-free switching between 32-bit PCM5102A and 8-bit built-in DAC with TPDF dither.
            -->
            ### 🎵 Music Hi-Fi v0.9.134 - Official Release

            > **📢 Notice from Gokul:** This update brings major performance improvements, battery optimization, data savings, and safety features. You can safely install this update directly!

            #### 🌟 Highlights & What's New:
            - **60% APK Size Reduction**: Shrunk the download size from 163 MB to **67.9 MB** with R8 whole-program optimization and native ABI stripping.
            - **Sub-500ms Instant App Startup**: Eliminated initial launch lag by staging heavy background services (yt-dlp, TLS, periodic workers) into deferred stages.
            - **Smart Network Caching & Battery Savings**: Added a 50 MB HTTP response cache and a 16-connection warm keep-alive pool. Reduces cell data usage and modem battery drain without touching bit-perfect FLAC audio quality.
            - **Automatic Pre-Update Database Snapshot**: Automatically creates a backup snapshot of your library database before any update is staged, preventing data loss.
            - **Emergency Update Rollback Support**: Built-in support to instantly push stable rollback versions to devices if any regression occurs.
            - **ESP32 Dual-Mode DAC Switching**: Dynamic pop-free switching between external 32-bit PCM5102A and internal built-in DAC with TPDF dither and FreeRTOS synchronization.

            #### 📦 Download:
            Download `Music.apk` below or tap "Update now" inside the app.
          files: dist/Music.apk
