name: Build Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  build:
    name: Build Music APK
    runs-on: ubuntu-latest
    timeout-minutes: 35 # Allows plenty of time for cold multi-module + C++ NDK build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Configure Swap Space (Prevent OOM Killer)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew permissions
        run: chmod +x gradlew

      - name: Accept SDK Licenses & Install NDK + CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Arduino core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Compile ESP32 firmware
        run: |
          set -o pipefail
          arduino-cli compile --fqbn esp32:esp32:esp32 \
            --build-path "$RUNNER_TEMP/esp32-build" firmware_wifi_softap \
            2>&1 | tee firmware-build.log

      - name: Run unit tests and build Debug APK
        env:
          LOSSLESS_CONFIG_URL: "https://stash-tipjar.rawnaldclark.workers.dev/lossless.json"
          LOSSLESS_CONFIG_PUBKEY: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAELiPYu7/k+TmVCojPEECT2w8tTnoy597StnnmS3vSiPxJ9AtluqhnIinmdknRi+h2ElUzkXYHoJjfzpoLGF46Cg"
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --no-parallel --max-workers=2 --stacktrace 2>&1 | tee android-build.log

      - name: Surface build failure details
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY' > android-test-failures.log
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path(".").glob("**/build/test-results/testDebugUnitTest/TEST-*.xml"))
          if not reports:
              print("No JUnit XML reports were produced.")
          for report in reports:
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  for result in case:
                      if result.tag not in {"failure", "error"}:
                          continue
                      print(f"{case.get('classname')}#{case.get('name')}: {result.get('type', result.tag)}")
                      if result.get("message"):
                          print(result.get("message"))
                      if result.text:
                          print("\n".join(result.text.splitlines()[:18]))
                      print()
          PY
          for log_file in firmware-build.log android-build.log android-test-failures.log; do
            if [ -f "$log_file" ]; then
              if [ "$log_file" = "android-build.log" ]; then
                details="$(grep -E '(^e: |^FAILURE:|What went wrong:|Execution failed for task|Unresolved reference|Type mismatch|Cannot infer|Expecting |Compilation error|There were failing tests|tests? failed|FAILED)' "$log_file" | tail -n 45 || true)"
                if [ -z "$details" ]; then
                  details="$(tail -n 45 "$log_file")"
                fi
              elif [ "$log_file" = "android-test-failures.log" ]; then
                details="$(head -n 65 "$log_file")"
              else
                details="$(tail -n 45 "$log_file")"
              fi
              details="${details//'%'/'%25'}"
              details="${details//$'\r'/'%0D'}"
              details="${details//$'\n'/'%0A'}"
              echo "::error title=${log_file} tail::${details}"
            fi
          done

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-logs
          path: |
            firmware-build.log
            android-build.log
            android-test-failures.log
            core/media/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare APK for Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/Music.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music-HiFi-App
          path: |
            dist/Music.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v0.9.131
          name: "Music Hi-Fi v0.9.131"
          body: |
            <!-- stash-app
            Official update from Gokul (Developer). Safe to install!
            - Verified Official Update | Upstream Stash updates are blocked; this is our official verified update, safe to install.
            - Seamless Music Downloads | Active automatic fallbacks prevent downloads from hanging or failing when Tidal relays are busy.
            - ESP32 Hi-Fi DAC Streaming | Rate-aware APLL clock switching (44.1 kHz - 192 kHz) and exclusive streaming.
            -->
            ### 🎵 Music Hi-Fi v0.9.131 - Official Verified Update

            > **📢 Notice from Gokul:** This is an official, verified update from our repository. Upstream Stash updates have been blocked to prevent overwriting your installation and data. You can safely install this update directly!

            #### 🌟 Highlights & What's New:
            - **Verified Official Release**: Safe to update directly from the app.
            - **Seamless Music Downloads**: Automatic fallback to YouTube/JioSaavn when Tidal is busy. Instant retry when tapping download.
            - **Dynamic Rate-Aware ESP32 DAC Streaming**: Automatically negotiates and switches ESP32 I2S hardware APLL clock on-the-fly (44.1 kHz - 192 kHz) via UDP handshake.
            - **Single-Stream Exclusive Audio**: Automatically holds crossfade when streaming to external ESP32 DAC.
            - **Continuous Radio & Upstream Hardening**: Seamless autoplay transitions and byte-exact playback stability.

            #### 📦 Download:
            Download `Music.apk` below or tap "Update now" inside the app.
          files: dist/Music.apk
